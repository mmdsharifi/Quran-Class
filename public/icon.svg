<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Decorative border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.3" />
  <!-- Islamic geometric motif / star -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#glow)">
    <!-- 8-point star -->
    <path d="M-80,-80 L0,-120 L80,-80 L120,0 L80,80 L0,120 L-80,80 L-120,0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
    <path d="M-100,-40 L-40,-100 L40,-100 L100,-40 L100,40 L40,100 L-40,100 L-100,40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
    <!-- Open Book Symbol (Quran) -->
    <path d="M -90,-20 C -60,-35 -30,-35 0,-15 C 30,-35 60,-35 90,-20 L 90,40 C 60,25 30,25 0,45 C -30,25 -60,25 -90,40 Z" fill="url(#goldGrad)" />
    <!-- Book pages lines / detailing -->
    <path d="M -80,-10 C -55,-23 -25,-23 0,-5 M 0,-5 C 25,-23 55,-23 80,-10" fill="none" stroke="#134e4a" stroke-width="3" opacity="0.6" />
    <path d="M -80,5 C -55,-8 -25,-8 0,10 M 0,10 C 25,-8 55,-8 80,5" fill="none" stroke="#134e4a" stroke-width="3" opacity="0.6" />
    <path d="M -80,20 C -55,7 -25,7 0,25 M 0,25 C 25,7 55,7 80,20" fill="none" stroke="#134e4a" stroke-width="3" opacity="0.6" />
    <!-- Center divider line -->
    <line x1="0" y1="-12" x2="0" y2="45" stroke="#ca8a04" stroke-width="3" />
    <!-- Glowing star/accent on top -->
    <path d="M 0,-40 L 4,-48 L 12,-52 L 4,-56 L 0,-64 L -4,-56 L -12,-52 L -4,-48 Z" fill="url(#goldGrad)" />
  </g>
</svg>
